<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Chanzaib Goods Transport (Regd)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f051d; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; position: relative; }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-position: center; opacity: 0.12; z-index: -1; pointer-events: none;
        }
        .bismillah { background: linear-gradient(90deg, #111, #1a0b2e, #111); color: #ff4d4d; text-align: center; padding: 10px; font-size: 14px; font-weight: bold; letter-spacing: 2px; border-bottom: 2px solid #ff4d4d; }
        header { background: linear-gradient(135deg, rgba(30, 12, 58, 0.95), rgba(20, 8, 38, 0.98)); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; border-bottom: 3px solid #ff4d4d; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-badge { background: linear-gradient(135deg, #ff4d4d, #cc0000); color: white; padding: 8px 16px; font-size: 22px; font-weight: bold; border-radius: 50% / 30%; border: 2px solid #fff; }
        .logo-area h1 { font-size: 20px; color: #fff; font-weight: 700; }
        .logo-area span { color: #ff4d4d; display: block; font-size: 11px; font-weight: 600; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
        nav ul li a { color: #e2e8f0; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px 0; display: block; transition: 0.3s; }
        nav ul li a:hover, nav ul li a.active { color: #ff4d4d; }
        .subheader { background: linear-gradient(90deg, #240d47, #3d1b73); color: white; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; }
        .subheader h2 { font-size: 18px; font-weight: 600; }
        .breadcrumb { font-size: 13px; color: #cbd5e1; }
        .breadcrumb span { color: #ff4d4d; font-weight: bold; }
        .main-container { padding: 50px; max-width: 600px; margin: 0 auto; flex: 1; width: 100%; }
        .content-box { background: linear-gradient(145deg, #180b2e, #130724); padding: 40px; border-radius: 12px; border-top: 4px solid #ff4d4d; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .content-box h2 { color: #fff; font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid #ff4d4d; padding-bottom: 10px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; background: rgba(255,255,255,0.07); color: white; border: 1px solid rgba(255,255,255,0.15); font-size: 14px; }
        .btn-login { width: 100%; padding: 12px; background: #ff4d4d; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 15px; }
        footer { background: #080211; color: white; margin-top: auto; border-top: 4px solid #ff4d4d; text-align: center; padding: 20px; font-size: 13px; color: #64748b; }
        @media (max-width: 992px) {
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            nav ul { flex-wrap: wrap; justify-content: center; gap: 10px 15px; }
            .subheader { padding: 15px 20px; flex-direction: column; gap: 5px; text-align: center; }
            .main-container { padding: 20px; }
            .content-box { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <header>
        <div class="logo-area">
            <div class="logo-badge">CZ</div>
            <div>
                <h1>CHANZAIB</h1>
                <span>GOODS TRANSPORT COMPANY (REGD)</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="admin.html" class="active" style="color: #ff4d4d;">ADMIN PANEL</a></li>
            </ul>
        </nav>
    </header>
    <div class="subheader">
        <h2>Admin Panel</h2>
        <div class="breadcrumb">HOME / <span>Admin</span></div>
    </div>
    <div class="main-container">
        <div class="content-box">
            <h2>Admin Login</h2>
            <form onsubmit="event.preventDefault(); alert('Admin login system active.');">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login">LOGIN</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Chanzaib Goods Transport Company (Regd). All rights reserved.</p>
    </footer>
</body>
</html>
